# Two tenants, opted in to Argo CD with one annotation each: the Basic
# edition's limit, and enough to see isolation. Each names an owners group and
# a viewers group; who is in them is managed outside the tenant. Each gets a namespace for its
# workloads (<tenant>-dev) and one for its Argo CD Applications
# (<tenant>-argocd). The label on <tenant>-dev lets OpenShift GitOps deploy
# there: its Argo CD can only read the other namespaces on the cluster.
#
# Every tenant names a Quota. This one only caps the number of pods.
apiVersion: tenantoperator.stakater.com/v1beta1
kind: Quota
metadata:
  name: small
spec:
  resourcequota:
    hard:
      pods: "10"
---
apiVersion: tenantoperator.stakater.com/v1beta3
kind: Tenant
metadata:
  name: acme
  annotations:
    argocd.tenantoperator.stakater.com/enabled: "true"
spec:
  quota: small
  accessControl:
    owners:
      groups: [acme-owners]
    viewers:
      groups: [acme-viewers]
  namespaces:
    withTenantPrefix:
      - dev
      - argocd
    metadata:
      specific:
        - namespaces: [acme-dev]
          labels:
            argocd.argoproj.io/managed-by: openshift-gitops
---
apiVersion: tenantoperator.stakater.com/v1beta3
kind: Tenant
metadata:
  name: globex
  annotations:
    argocd.tenantoperator.stakater.com/enabled: "true"
spec:
  quota: small
  accessControl:
    owners:
      groups: [globex-owners]
    viewers:
      groups: [globex-viewers]
  namespaces:
    withTenantPrefix:
      - dev
      - argocd
    metadata:
      specific:
        - namespaces: [globex-dev]
          labels:
            argocd.argoproj.io/managed-by: openshift-gitops
