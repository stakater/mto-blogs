# A single Keycloak, in dev mode, as a stand-in for your company's identity
# provider. It keeps everything in memory: a restart loses the realm, so run
# keycloak-realm.sh again. For learning only. In production, Dex connects to
# your existing identity provider instead.
#
# The admin credentials come from the Secret keycloak-admin, created by the
# tutorial, never from this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start-dev"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # KC_HOSTNAME is set by the tutorial, to the route's https URL.
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: keycloak
spec:
  to: { kind: Service, name: keycloak }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
