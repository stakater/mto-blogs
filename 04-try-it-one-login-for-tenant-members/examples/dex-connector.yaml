# Connect the Dex that ships with Multi-Tenant Operator to the identity
# provider. In this tutorial that's the Keycloak stand-in; in production it's
# your company's identity provider. The connection details (issuer, client ID
# and secret) are in the Secret keycloak-connector-config, created by the
# tutorial, never in this file.
apiVersion: auth.stakater.com/v1alpha1
kind: Connector
metadata:
  name: keycloak
  namespace: multi-tenant-operator
spec:
  type: oidc
  id: keycloak
  name: Company sign-in
  configSecretRef:
    name: keycloak-connector-config
