# Connect the Dex that ships with Multi-Tenant Operator to your company's
# identity provider, in place of the tutorial's local users. The connection
# details (issuer, client ID and secret) are in the Secret
# company-connector-config, created as the tutorial shows, never in this file.
apiVersion: auth.stakater.com/v1alpha1
kind: Connector
metadata:
  name: company
  namespace: multi-tenant-operator
spec:
  type: oidc
  id: company
  name: Company sign-in
  configSecretRef:
    name: company-connector-config
