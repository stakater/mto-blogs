# The dev cluster. Same team as everywhere else; a smaller budget. The only
# thing this overlay changes is the Quota's numbers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  stakater.com/environment: dev
patches:
  - target:
      kind: Quota
      name: acme-quota
    patch: |-
      - op: replace
        path: /spec/resourcequota/hard/requests.cpu
        value: "2"
      - op: replace
        path: /spec/resourcequota/hard/requests.memory
        value: 4Gi
      - op: replace
        path: /spec/resourcequota/hard/pods
        value: "5"
