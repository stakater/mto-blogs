# The prod environment. Same team as everywhere else, with a larger budget. The
# only thing this overlay changes is the Quota's numbers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  stakater.com/environment: prod
patches:
  - target:
      kind: Quota
      name: globex-quota
    patch: |-
      - op: replace
        path: /spec/resourcequota/hard/requests.cpu
        value: "20"
      - op: replace
        path: /spec/resourcequota/hard/requests.memory
        value: 40Gi
      - op: replace
        path: /spec/resourcequota/hard/pods
        value: "50"
