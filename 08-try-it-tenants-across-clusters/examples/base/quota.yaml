# The team's resource budget, with middle-of-the-road defaults. Each overlay
# replaces these numbers for its environment: smaller on the dev cluster,
# larger on the production cluster. The name stays the same, so the Tenant's
# `spec.quota: acme-quota` reference holds everywhere.
apiVersion: tenantoperator.stakater.com/v1beta1
kind: Quota
metadata:
  name: acme-quota
spec:
  resourcequota:
    hard:
      requests.cpu: "4"
      requests.memory: 8Gi
      pods: "10"
