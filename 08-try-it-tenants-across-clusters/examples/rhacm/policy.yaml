# Distribution, mechanism 2: Red Hat Advanced Cluster Management (RHACM).
#
# RHACM carries the same team to the same clusters as governance, not GitOps:
# a Policy enforces the Tenant and its Quota, a Placement binds it to the dev
# clusters by label, and a PlacementBinding ties the two together. RHACM then
# reports each spoke's compliance and re-applies the objects if they drift.
#
# This file is the DEV environment. Production is the same Policy with the
# prod Quota numbers (cpu "20", memory 40Gi, pods "50") and the Placement
# selecting `stakater.com/environment: prod`.
#
# The Tenant and Quota below are the rendered output of overlays/dev — the
# same base and overlay the Argo path uses. In practice you generate these
# Policies from the overlays with the RHACM Policy Generator, so the overlay
# stays the one source of truth rather than being copied here by hand.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: acme-tenant-dev
  namespace: tenancy-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acme-tenant-dev
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: tenantoperator.stakater.com/v1beta3
                kind: Tenant
                metadata:
                  name: acme
                spec:
                  quota: acme-quota
                  accessControl:
                    owners:
                      groups:
                        - acme-owners
                    viewers:
                      groups:
                        - acme-viewers
                  namespaces:
                    withTenantPrefix:
                      - apps
            - complianceType: musthave
              objectDefinition:
                apiVersion: tenantoperator.stakater.com/v1beta1
                kind: Quota
                metadata:
                  name: acme-quota
                spec:
                  resourcequota:
                    hard:
                      requests.cpu: "2"
                      requests.memory: 4Gi
                      pods: "5"
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: acme-tenant-dev
  namespace: tenancy-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: stakater.com/environment
              operator: In
              values:
                - dev
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: acme-tenant-dev
  namespace: tenancy-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: acme-tenant-dev
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: acme-tenant-dev
